# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for SigNoz — HTTP → HTTPS redirect + reverse proxy
# Replace watcher.unifers.ai with your actual domain e.g. signoz.mycompany.com
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name watcher.unifers.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name watcher.unifers.ai;

    # TLS certificates (generated by certbot)
    ssl_certificate     /etc/ssl/www_unifers_ai.pem;
    ssl_certificate_key /etc/ssl/www_unifers_ai.key;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increase timeouts for SSE (real-time log/trace streaming)
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    send_timeout        3600s;

    # File upload limit (for dashboards/config imports)
    client_max_body_size 32m;

    location / {
        proxy_pass         http://signoz:8080;
        proxy_http_version 1.1;

        # WebSocket / SSE support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Forward real IP
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streams
        proxy_buffering off;
    }
}